name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Package extension
        run: npx @vscode/vsce package --out windsurf-chat-open-${{ steps.version.outputs.VERSION }}.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windsurf-chat-open-${{ steps.version.outputs.VERSION }}
          path: windsurf-chat-open-${{ steps.version.outputs.VERSION }}.vsix

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windsurf-chat-open-${{ steps.version.outputs.VERSION }}.vsix
          name: WindsurfChatOpen v${{ steps.version.outputs.VERSION }}
          body: |
            ## WindsurfChatOpen v${{ steps.version.outputs.VERSION }}
            
            ### 安装方法
            1. 下载 `windsurf-chat-open-${{ steps.version.outputs.VERSION }}.vsix` 文件
            2. 在 VSCode/Windsurf 中按 `Ctrl+Shift+P`
            3. 输入 `Extensions: Install from VSIX...`
            4. 选择下载的文件
            
            详细更新内容请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          draft: false
          prerelease: false
