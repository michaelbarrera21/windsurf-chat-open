name: Build and Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Get package info
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "vsix_file=${NAME}-${VERSION}.vsix" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="v${{ steps.package.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping release"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create release"
          fi

      - name: Package extension
        run: npx @vscode/vsce package --out ${{ steps.package.outputs.vsix_file }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: ${{ steps.package.outputs.vsix_file }}
          retention-days: 30

      - name: Create tag and release
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          TAG="v${{ steps.package.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: WindsurfChatOpen v${{ steps.package.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.package.outputs.vsix_file }}
          body: |
            ## 📦 WindsurfChatOpen v${{ steps.package.outputs.version }}
            
            ### 安装方法
            
            1. 下载下方的 `.vsix` 文件
            2. 打开 VSCode / Windsurf / Cursor
            3. 按 `Ctrl+Shift+P`，输入 `Install from VSIX` 
            4. 选择下载的 `.vsix` 文件
            5. 重启 IDE
            
            ### 功能特性
            - ✅ 让 AI 停下来听你说话
            - ✅ 智能对话控制
            - ✅ 多实例支持
            - ✅ 开源免费
            
            ---
            *自动构建于 ${{ github.sha }}*
            
            详细更新内容请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
